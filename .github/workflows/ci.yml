name: Package and reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install . ruff==0.17.4
      - run: ruff check src
      - run: ruff format --check src
      - run: catch-my-drift --help
      - name: Validate experiment presets without model downloads
        run: |
          for config in configs/*.json; do
            catch-my-drift validate --config "$config"
          done
      - name: Recompute the included measurements
        run: catch-my-drift reproduce --out outputs/paper-results
