[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catch-my-drift"
version = "0.1.0"
description = "User-intent reports, activation readouts and behavioral departures in multi-agent panels"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chih-Hao Howard Hsu"}]
dependencies = ["numpy>=1.24,<3", "safetensors>=0.4,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
inference = ["torch>=2.8,<3", "transformers==4.57.6", "huggingface-hub>=0.34,<1"]

[project.urls]
Repository = "https://github.com/HowardHsuuu/Catch-My-Drift_user-intent-understanding-in-LLMs"

[project.scripts]
catch-my-drift = "intent_panel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intent_panel = ["assets/*.json", "assets/*.jsonl.gz"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
